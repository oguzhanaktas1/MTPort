name: MTPort
options:
  bundleIdPrefix: dev.mtport
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  MTPort:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Model
      - path: Services
      - path: Views
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MTPort
        CFBundleDisplayName: MTPort
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: "0.1.0"
        LSUIElement: false           # regular app (Dock icon + window) in addition to the menu bar item
        LSMinimumSystemVersion: "15.4"
        NSHumanReadableCopyright: "Developer preview. Not signed or notarized."
    entitlements:
      path: Resources/MTPort.entitlements
      properties: {}                # no App Sandbox: the app launches the local agent and talks to its user socket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mtport.MTPort
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Copy native binaries (if built)
        basedOnDependencyAnalysis: false
        script: |
          # Optional: bundle the C++ tools next to the app when scripts/build-native.sh has produced them.
          SRC="${SRCROOT}/../../build/native"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin"
          mkdir -p "${DEST}"
          for f in cli/mtport agent/mtport-agent mount/mtport-mount; do
            if [ -x "${SRC}/${f}" ]; then cp -f "${SRC}/${f}" "${DEST}/"; fi
          done
          exit 0
  MTPortTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MTPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mtport.MTPortTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MTPort.app/Contents/MacOS/MTPort"
schemes:
  MTPort:
    build:
      targets:
        MTPort: all
    test:
      targets: [MTPortTests]
